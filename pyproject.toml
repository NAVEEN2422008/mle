[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aditya-flarecast"
version = "0.1.0"
description = "Automated solar flare nowcasting & forecasting using Aditya-L1 SoLEXS + HEL1OS data"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "astropy>=5.3.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pyarrow>=12.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.1.0"]
viz = ["plotly>=5.15.0", "streamlit>=1.25.0"]
edge = ["onnx>=1.14.0", "onnxruntime>=1.15.0"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pyright]
include = ["src", "scripts", "tests"]
extraPaths = ["."]
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"